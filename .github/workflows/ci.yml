name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify files exist
        run: |
          echo "Checking project files..."
          ls -la
          test -f index.html && echo "index.html found" || (echo "index.html missing" && exit 1)

      - name: Generate build log
        run: echo "Build completed successfully at $(date)" > build.log

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Notify Success on Slack
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{
            "text": "✅ *Build Succeeded* for devops-webapp\nCommit: ${{ github.sha }}\nBranch: ${{ github.ref_name }}\nTriggered by: ${{ github.actor }}"
          }' ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Failure on Slack
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{
            "text": "❌ *Build Failed* for devops-webapp\nCommit: ${{ github.sha }}\nBranch: ${{ github.ref_name }}\nTriggered by: ${{ github.actor }}"
          }' ${{ secrets.SLACK_WEBHOOK_URL }}